<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Received | offver</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      max-width: 480px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .brand {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .brand span {
      color: #ff6600;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 12px;
    }

    p {
      color: #555;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      padding: 12px 20px;
      background: #ff6600;
      color: #fff;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand">off<span>ver</span></div>

    <h1>Request Received</h1>

    <p>
      Your account deletion request has been submitted.<br><br>
      Our team will process your request and delete your account and associated data in accordance with our privacy policy.
    </p>

    <a href="/" class="button">Return Home</a>
  </div>

</body>
</html>
