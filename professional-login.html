<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Professional sign in — offver</title><link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="offver-professional.css"></head><body><header class="header"><div class="container header-inner"><a class="brand" href="index.html">off<b>ver</b></a><a class="btn secondary" href="professional-signup.html">create account</a></div></header><main class="page"><div class="container narrow"><div class="page-title"><h1>Professional sign in</h1><p id="confirmedText">Access your verification and private profile.</p></div><form class="card" id="loginForm"><div class="field-grid"><div class="field full"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field full"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div></div><button class="btn wide" id="loginButton" type="submit" style="margin-top:26px">Sign In</button><div class="message" id="loginMessage"></div></form></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="offver-professional.js"></script><script>
if(new URLSearchParams(location.search).has("confirmed"))confirmedText.textContent="Your email is confirmed. Sign in to continue to professional verification.";
loginForm.addEventListener("submit",async e=>{e.preventDefault();clearMessage("loginMessage");loginButton.disabled=true;const {error}=await supabaseClient.auth.signInWithPassword({email:email.value.trim().toLowerCase(),password:password.value});loginButton.disabled=false;if(error){showMessage("loginMessage",error.message);return}location.href="professional-account.html"});
</script></body></html>
