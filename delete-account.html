<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Account Deletion | offver</title>
  <style>
    :root {
      --orange: #ff6600;
      --charcoal: #1a1a1a;
      --light: #f7f7f7;
      --border: #e6e6e6;
      --text: #222222;
      --muted: #666666;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--light);
      color: var(--text);
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      width: 100%;
      max-width: 640px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 36px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }

    .brand {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 18px;
      letter-spacing: -0.02em;
    }

    .brand .off {
      color: #000000;
    }

    .brand .ver {
      color: var(--orange);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 30px;
      line-height: 1.1;
      color: var(--charcoal);
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 15px;
    }

    form {
      display: grid;
      gap: 18px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      color: var(--charcoal);
    }

    input,
    textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background: #fff;
    }

    input:focus,
    textarea:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255, 102, 0, 0.12);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .button {
      appearance: none;
      border: none;
      background: var(--orange);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 18px;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .button:hover {
      opacity: 0.95;
    }

    .button:active {
      transform: translateY(1px);
    }

    .fine-print {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .fine-print a {
      color: var(--orange);
      text-decoration: none;
    }

    @media (max-width: 640px) {
      .card {
        padding: 24px;
      }

      h1 {
        font-size: 26px;
      }

      .brand {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="brand">
        <span class="off">off</span><span class="ver">ver</span>
      </div>

      <h1>Request Account Deletion</h1>
      <p>
        Users can request deletion of their account and associated data by submitting
        the form below. Upon request, we will delete your account and personal
        information in accordance with our privacy policy.
      </p>

      <form action="https://formsubmit.co/info@offver.com" method="POST">
        <!-- FormSubmit settings -->
        <input type="hidden" name="_subject" value="offver Account Deletion Request" />
        <input type="hidden" name="_captcha" value="false" />
        <input type="hidden" name="_template" value="table" />
        <!-- Optional redirect after submit -->
        <input type="hidden" name="_next" value="https://offver.com/delete-account-success" />

        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="Email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="field">
          <label for="fullName">Full name</label>
          <input
            type="text"
            id="fullName"
            name="Full Name"
            placeholder="Enter your full name"
            required
          />
        </div>

        <div class="field">
          <label for="note">Optional note</label>
          <textarea
            id="note"
            name="Note"
            placeholder="Add any details that may help us identify your account"
          ></textarea>
        </div>

        <button class="button" type="submit">Submit</button>
      </form>

      <div class="fine-print">
        You may also review our <a href="/privacy-policy">Privacy Policy</a>.
      </div>
    </section>
  </main>
</body>
</html>
